apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels: # this app:backend label is used to group the pods with same label in the servie 
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true # prevents the process from running as root.
        runAsUser: 1000  # the process runs as user ID 1000
        fsGroup: 1000   # provides group-based access to supported mounted volumes.
      containers:
        - name: backend-container
          image: apptest1
          imagePullPolicy: IfNotPresent
          envFrom:     # every key from each becomes an environment variable.
            - secretRef:  # for the sensitive data stored and be shraed 
                name: envshit
            - configMapRef: # for the insensitive data stored and be shraed 
                name: configshit
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 400Mi
            limits:
              cpu: 250m
              memory: 600Mi