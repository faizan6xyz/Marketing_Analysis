 # pg_hba.conf is Postgres's access control list. It decides who can connect, from where, to which database, and how they must authenticate. Postgres reads it top to bottom and uses the first line that matches the incoming connection.

local   all           all                    trust # Connections through the Unix socket (inside the container) to any database, as any user, need no password.
host    all           all   127.0.0.1/32     trust # Same, over TCP from localhost (IPv4).
host    all           all   ::1/128          trust # Same, over TCP from localhost (IPv6).
local   replication   all                    trust # Replication connections through the socket, no password.
host    replication   all   127.0.0.1/32     trust # Replication connections from localhost, no password.
host    replication   all   ::1/128          trust # Replication connections from localhost, no password.
host    replication   leojr all              scram-sha-256 # The line that fixes your problem. User leojr may open a replication connection from any IP, with a password.
host    all           all   all              scram-sha-256 # Everything else (normal queries from other containers or hosts) needs a password.
