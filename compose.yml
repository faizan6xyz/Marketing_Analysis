    image: apptest1
    user: appuser
    container_name: apptestcon1
    cpus: "0.5"
    mem_limit: 400m
    ports:
      - "5000-5014:5000-5014"
    env_file:
      - .env
    environment:
      DB_WRITE_HOST: db
      DB_READ_HOST: db2
    volumes:
      - app_data1:/data
