apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: leo-social
  name: backend-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: backend
  namespace: leo-social
spec:
  serviceName: backend-headless
  # Replicas are managed by the HPA
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
      containers:
        - name: backend-container
          image: ghcr.io/faizan6xyz/shi:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: envshit
            - configMapRef:
                name: configshit
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 400Mi
            limits:
              cpu: 250m
              memory: 600Mi
          volumeMounts:
            - name: data
              mountPath: /app/data  