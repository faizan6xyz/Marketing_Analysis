apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: leo-social
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      serviceAccountName: db-controller
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: db-watch
          image: ghcr.io/faizan6xyz/db_watch:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: env-shit
          resources:
            requests:
              memory: "50Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 6000
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}