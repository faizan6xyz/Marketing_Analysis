# Run with: podman kube play --network dbnet postgres-pods.yaml
apiVersion: v1
kind: Secret
metadata:
  name: db-env
stringData:
  DB_PASSWORD: "change-me"  
---
apiVersion: v1
kind: Pod
metadata:
  name: db2
  labels:
    app: postgres
    role: replica
spec:
  hostname: db2
  restartPolicy: Always
  containers:
    - name: pg
      image: docker.io/library/postgres:16
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      command: ["/bin/bash", "-c"]
      args:
        - |
          until pg_isready -h db -U leojr -d userdb; do sleep 2; done
          if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
            echo "Empty data dir, cloning from db..."
            pg_basebackup -h db -U leojr -D /var/lib/postgresql/data -R -X stream -C -S db2_slot -P \
              || {
                echo "clone failed"
                rm -rf /var/lib/postgresql/data/*
                psql -h db -U leojr -d userdb -c "SELECT pg_drop_replication_slot('db2_slot')" || true
                exit 1
              }
            chmod 700 /var/lib/postgresql/data
          fi
          exec postgres \
            -c shared_buffers=256MB \
            -c effective_cache_size=512MB \
            -c work_mem=4MB \
            -c maintenance_work_mem=64MB \
            -c max_connections=80 \
            -c max_parallel_workers_per_gather=0 \
            -c autovacuum_max_workers=2 \
            -c autovacuum_work_mem=64MB \
            -c wal_compression=zstd \
            -c default_toast_compression=lz4 \
            -c max_wal_size=512MB \
            -c min_wal_size=80MB \
            -c temp_file_limit=1GB \
            -c statement_timeout=60s \
            -c idle_in_transaction_session_timeout=30s \
            -c hba_file=/etc/postgresql/pg_hba.conf \
            -c wal_level=replica \
            -c max_wal_senders=5 \
            -c max_replication_slots=5 \
            -c max_slot_wal_keep_size=1GB \
            -c wal_log_hints=on \
            -c hot_standby=on \
            -c hot_standby_feedback=on
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: db-env
              key: DB_PASSWORD
      resources:
        limits:
          cpu: 100m
          memory: 1Gi
      livenessProbe:
        exec:
          command: ["pg_isready", "-U", "leojr", "-d", "userdb"]
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: dshm
          mountPath: /dev/shm
        - name: hba
          mountPath: /etc/postgresql/pg_hba.conf
          readOnly: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: db2_data
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 256Mi
    - name: hba
      hostPath:
        path: /opt/pg/pg_hba.conf
        type: File
---
