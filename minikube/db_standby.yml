apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-standby
spec:
  replicas: 2
  selector:
    matchLabels:
      primary: "false"
  template:
    metadata:
      labels:
        primary: "false"
    spec:
      containers:
        - name: db
          image: db2_image
          ports:
            - containerPort: 5432
          env:
            - name: ENV
              value: "production"
          resources:
            requests: { cpu: "100m", memory: "300Mi" }
            limits:   { cpu: "200m", memory: "1Gi" }
