# Headless service: gives each pod a stable DNS name (backend-0.backend-headless...)
apiVersion: v1
kind: Service
metadata:
  name: backend-headless
  namespace: leo-social
  labels:
    app: backend
spec:
  clusterIP: None
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
# Regular service: load-balanced entry point for clients
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: leo-social
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP