# gives each pod a stable DNS name . backend-headless — lets you address individual backend Pods using stable DNS names.
apiVersion: v1
kind: Service
metadata:
  name: backend-headless
  namespace: leo-social
  labels:
    app: backend
spec:
  clusterIP: None
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
# load-balanced entry point for clients . backend-service — gives clients one DNS name and distributes requests across the backend Pods.
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: leo-social
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP