#   # Normally, a Kubernetes Service provides a single virtual IP that distributes traffic across multiple pods. A headless Service skips that virtual IP and allows clients to discover individual pod IP addresses directly through DNS.
# apiVersion: v1
# kind: Service
# metadata:
#   name: backend-headless
#   namespace: leo-social
#   labels:
#     app: backend
# spec:
#   clusterIP: None
#   selector:
#     app: backend
#   ports:
    # - { name: http-main,              port: 5000 }
    # - { name: http-campaign,          port: 5001 }
    # - { name: http-youtube,           port: 5002 }
    # - { name: http-x,                 port: 5003 }
    # - { name: http-whatsapp,          port: 5004 }
    # - { name: http-threads,           port: 5005 }
    # - { name: http-threads-webhook,   port: 5006 }
    # - { name: http-razorpay,          port: 5007 }
    # - { name: http-pinterest,         port: 5008 }
    # - { name: http-paypal,            port: 5009 }
    # - { name: http-instagram,         port: 5010 }
    # - { name: http-instagram-webhook, port: 5011 }
    # - { name: http-gmail,             port: 5012 }
    # - { name: http-drive,             port: 5013 }
    # - { name: http-gmail-webhook,     port: 5014 }
    # - { name: http-whatsapp-webhook,  port: 5015 }
# ---
# load-balanced entry point for clients . backend-service — gives clients one DNS name and distributes requests across the backend Pods.
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: leo-social
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:                       # targetPort defaults to port, so it's omitted
    - { name: http-main,              port: 5000 }
    - { name: http-campaign,          port: 5001 }
    - { name: http-youtube,           port: 5002 }
    - { name: http-x,                 port: 5003 }
    - { name: http-whatsapp,          port: 5004 }
    - { name: http-threads,           port: 5005 }
    - { name: http-threads-webhook,   port: 5006 }
    - { name: http-razorpay,          port: 5007 }
    - { name: http-pinterest,         port: 5008 }
    - { name: http-paypal,            port: 5009 }
    - { name: http-instagram,         port: 5010 }
    - { name: http-instagram-webhook, port: 5011 }
    - { name: http-gmail,             port: 5012 }
    - { name: http-drive,             port: 5013 }
    - { name: http-gmail-webhook,     port: 5014 }
    - { name: http-whatsapp-webhook,  port: 5015 }