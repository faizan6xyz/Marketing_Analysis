apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
      role: primary
  template:
    metadata:
      labels:
        app: db
        role: primary
    spec:
      containers:
        - name: db
          image: db_image
          ports:
            - containerPort: 5432
          env:
            - name: ENV
              value: "production"
          resources:
            requests: { cpu: "100m", memory: "500Mi" }
            limits:   { cpu: "300m", memory: "1Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-standby
spec:
  replicas: 2
  selector:
    matchLabels:
      app: db
      role: standby
  template:
    metadata:
      labels:
        app: db
        role: standby
    spec:
      containers:
        - name: db
          image: db2_image
          ports:
            - containerPort: 5432
          env:
            - name: ENV
              value: "production"
          resources:
            requests: { cpu: "100m", memory: "300Mi" }
            limits:   { cpu: "200m", memory: "1Gi" }