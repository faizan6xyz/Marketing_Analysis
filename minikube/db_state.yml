apiVersion: v1
kind: Service
metadata:
  name: db-write-service
  namespace: Leo_social
  labels:
    type: db
  annotations:
    description: "Routes to the current primary only"
spec:
  type: ClusterIP
  selector:
    app: postgres
    primary: "true"
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP