apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: leo-social
  name: nginx-ingress
  annotations:
    # Use cert-manager to issue and renew the TLS certificate from Let's Encrypt
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Route straight to pod IPs (L7) instead of going through the kube-proxy service VIP
    nginx.ingress.kubernetes.io/service-upstream: "false"
    # Send each request to the pod with the lowest exponentially weighted moving average latency
    nginx.ingress.kubernetes.io/load-balance: "ewma"
    # Sticky sessions (remove these 5 lines if your backend is stateless)
    # Pin each client to one pod using a cookie-based affinity
    nginx.ingress.kubernetes.io/affinity: "cookie"
    # Name the affinity cookie "route"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    # Expire the affinity cookie after 3600 seconds (1 hour)
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    # Only send the affinity cookie over HTTPS
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
    # Send the cookie on same-site requests and top-level navigations only
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    # Retries on another pod (idempotent requests only, by default)
    # Retry the request on the next pod when the upstream errors, times out, or returns 502/503
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503"
    # Try at most 3 upstream pods before giving up
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    # Rate limit per client IP, per ingress-nginx pod
    # Allow at most 20 requests per second from each client IP
    nginx.ingress.kubernetes.io/limit-rps: "5"
    # Uploads and slow requests
    # Accept request bodies (uploads) up to 100 MB
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    # Wait up to 500 seconds for the backend to send a response
    nginx.ingress.kubernetes.io/proxy-read-timeout: "500"
    # Wait up to 100 seconds when sending the request to the backend
    nginx.ingress.kubernetes.io/proxy-send-timeout: "100"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.yourdomain.com
      secretName: app-tls
  rules:
    - host: api.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000