apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: leo-social
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Route straight to pod IPs (this is already the default, kept for clarity)
    nginx.ingress.kubernetes.io/service-upstream: "false"
    nginx.ingress.kubernetes.io/load-balance: "ewma"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "500"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "100"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.yourdomain.com
      secretName: app-tls
  rules:
    - host: api.yourdomain.com
      http:
        paths:
          - { path: /,          pathType: Prefix, backend: { service: { name: backend-service, port: { number: 5000 } } } }
          - { path: /campaign,  pathType: Prefix, backend: { service: { name: backend-service, port: { number: 5001 } } } }
          - { path: /youtube,   pathType: Prefix, backend: { service: { name: backend-service, port: { number: 5002 } } } }
          - { path: /x,         pathType: Prefix, backend: { service: { name: backend-service, port: { number: 5003 } } } }
          - { path: /whatsapp,  pathType: Prefix, backend: { service: { name: backend-service, port: { number: 5004 } } } }
          - { path: /threads,   pathType: Prefix, backend: { service: { name: backend-service, port: { number: 5005 } } } }
          - { path: /razorpay,  pathType: Prefix, backend: { service: { name: backend-service, port: { number: 5007 } } } }
          - { path: /pinterest, pathType: Prefix, backend: { service: { name: backend-service, port: { number: 5008 } } } }
          - { path: /paypal,    pathType: Prefix, backend: { service: { name: backend-service, port: { number: 5009 } } } }
          - { path: /instagram, pathType: Prefix, backend: { service: { name: backend-service, port: { number: 5010 } } } }
          - { path: /gmail,     pathType: Prefix, backend: { service: { name: backend-service, port: { number: 5012 } } } }
          - { path: /drive,     pathType: Prefix, backend: { service: { name: backend-service, port: { number: 5013 } } } }