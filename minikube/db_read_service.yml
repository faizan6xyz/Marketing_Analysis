apiVersion: v1
kind: Service
metadata:
  name: db-read-service
  namespace: leo-social
  labels:
    type: db
  annotations:
    description: "Routes to the standby db for the reads only"
spec:
  type: ClusterIP
  selector:
    app: postgres
    primary: "false"
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP