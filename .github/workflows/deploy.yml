name: Deploy

on:
  workflow_run:
    workflows: ["Build-push"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -u             
            NS=leo-social
            STS=backend-dep
            IMAGE=ghcr.io/faizan6xyz/shi:${IMAGE_TAG}
            kubectl set image statefulset/$STS backend-container=$IMAGE -n $NS
            if ! kubectl rollout status statefulset/$STS -n $NS --timeout=600s; then
              echo "Rollout failed, rolling back"
              kubectl rollout history statefulset/$STS -n $NS
              kubectl rollout undo statefulset/$STS -n $NS
              kubectl rollout status statefulset/$STS -n $NS --timeout=300s
              exit 1
            fi