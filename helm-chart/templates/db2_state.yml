apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{.values.namespace}}
  name: db2-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db2
  namespace: {{.values.namespace}}
  labels:
    {{.values.db.label.key1}}: {{.values.db.label.value1}}
    {{.values.db.label.key2}}: {{.values.db.label.value2}}
spec:
  serviceName: {{.values.db.defaulservice}}
  replicas: 1
  selector:
    matchLabels:
      {{.values.db.label.key1}}: {{.values.db.label.value1}}
      {{.values.db.label.key2}}: {{.values.db.label.value2}}
  template:
    metadata:
      labels:
        {{.values.db.label.key1}}: {{.values.db.label.value1}}
        {{.values.db.label.key2}}: {{.values.db.label.value2}}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
      containers:
        - name: db2
          image: docker.io/library/postgres:16
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          command: ["/bin/bash", "-c"]
          args:
            - |
              until pg_isready -h {{.values.db.changedservice}} -U leojr -d userdb; do sleep 2; done
              if [ ! -s "$PGDATA/PG_VERSION" ]; then
                echo "Empty data dir, cloning from primary..."
                rm -rf "$PGDATA"/*
                psql -h {{.values.db.changedservice}} -U leojr -d userdb -c "SELECT pg_drop_replication_slot('db2_slot')" 2>/dev/null || true
                pg_basebackup -h {{.values.db.changedservice}} -U leojr -D "$PGDATA" -R -X stream -C -S db2_slot -P \
                  || {
                    echo "clone failed"
                    rm -rf "$PGDATA"/*
                    psql -h {{.values.db.changedservice}} -U leojr -d userdb -c "SELECT pg_drop_replication_slot('db2_slot')" || true
                    exit 1
                  }
                chmod 700 "$PGDATA"
              fi
              exec postgres \
                -c shared_buffers=256MB \
                -c effective_cache_size=512MB \
                -c work_mem=4MB \
                -c maintenance_work_mem=64MB \
                -c max_connections=80 \
                -c max_parallel_workers_per_gather=0 \
                -c autovacuum_max_workers=2 \
                -c autovacuum_work_mem=64MB \
                -c wal_compression=zstd \
                -c default_toast_compression=lz4 \
                -c max_wal_size=512MB \
                -c min_wal_size=80MB \
                -c temp_file_limit=1GB \
                -c statement_timeout=60s \
                -c idle_in_transaction_session_timeout=30s \
                -c hba_file=/etc/postgresql/pg_hba.conf \
                -c wal_level=replica \
                -c max_wal_senders=5 \
                -c max_replication_slots=5 \
                -c max_slot_wal_keep_size=1GB \
                -c wal_log_hints=on \
                -c hot_standby=on \
                -c hot_standby_feedback=on
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{.values.env}}
                  key: DB_PASSWORD
          ports:
            - name: pg
              containerPort: {{.values.db.podport}}
          resources:
            requests:
              cpu: {{.values.db.resources.requests.cpu}}
              memory: {{.values.db.resources.requests.memory}}
            limits:
              cpu: {{.values.db.resources.limits.cpu}}
              memory: {{.values.db.resources.requests.memory}}
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "leojr", "-d", "userdb"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "leojr", "-d", "userdb"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "leojr", "-d", "userdb"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
            - name: hba
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db2-data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: hba
          configMap:
            name: {{.values.db.dbconfig}}