apiVersion: v1
kind: Service
metadata:
  name: db-read-service
  namespace: leo-social
  labels:
    type: db
  annotations:
    description: "Routes to the standby db for the reads only"
spec:
  type: ClusterIP
  selector:
    app: postgres
    primary: "false"
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: read-allow-backend-only
  namespace: leo-social
spec:
  podSelector:
    matchLabels:
      app: postgres
      primary: "false"
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Only pods labeled app=backend in the SAME namespace
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432        

        # if the pod is from the different namespace
    # - from:
    #    - namespaceSelector:
    #        matchLabels:
    #          kubernetes.io/metadata.name: backend-ns
    #      podSelector:
    #        matchLabels:
    #          app: backend