apiVersion: v1
kind: Service
metadata:
  name: {{.values.db.defaulservice}}
  namespace: {{.values.namespace}}
  labels:
    type: db
  annotations:
    description: "Routes to the standby db for the reads only"
spec:
  type: ClusterIP
  selector:
    {{.values.db.label.key1}}: {{.values.db.label.value1}}
    {{.values.db.label.key2}}: {{.values.db.label.value2}}
  ports:
    - name: postgres
      port: {{.values.db.serviceport}}
      targetPort: {{.values.db.podport}}
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: read-allow-backend-only
  namespace: {{.values.namespace}}
spec:
  podSelector:
    matchLabels:
      {{.values.db.label.key1}}: {{.values.db.label.value1}}
      {{.values.db.label.key2}}: {{.values.db.label.value2}}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Only pods labeled app=backend in the SAME namespace
        - podSelector:
            matchLabels:
              {{.values.backend.label.key1}}: {{.values.backend.label.value1}}
      ports:
        - protocol: TCP
          port: {{.values.db.podport}}       

        # if the pod is from the different namespace
    # - from:
    #    - namespaceSelector:
    #        matchLabels:
    #          kubernetes.io/metadata.name: backend-ns
    #      podSelector:
    #        matchLabels:
    #          app: backend