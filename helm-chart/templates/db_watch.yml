# This is the pod’s identity inside the cluster. Kubernetes automatically mounts a token for it into the pod, and kubectl inside the container uses that token, so you don’t need a kubeconfig. Without this, the pod runs as default, which has almost no permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: {{.values.namespace}}
---
# A Role is a list of permissions, and it only applies inside leo-social. Each rule has three parts: which API group, which resources, and which verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller
  namespace: {{.values.namespace}}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch", "update"]
---
# This says the ServiceAccount controller gets the permissions in the Role controller. A Role does nothing until something is bound to it.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller
  namespace: {{.values.namespace}}
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: {{.values.namespace}}
roleRef:
  kind: Role
  name: controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: {{.values.namespace}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      serviceAccountName: controller
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: db-watch
          image: {{.values.db.dbwatchimage}}
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: {{.values.env}}
          resources:
            requests:
              memory: "50Mi"
              cpu: "70m"
            limits:
              memory: "200Mi"
              cpu: "200m"
          ports:
            - containerPort: {{.values.db.watchport}}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}