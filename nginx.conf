    server backend4:5005 max_fails=2 fail_timeout=10s; }
  upstream app_06 {   # threads.webhook
    server backend1:5006 max_fails=2 fail_timeout=10s;
    server backend2:5006 max_fails=2 fail_timeout=10s;
    server backend3:5006 max_fails=2 fail_timeout=10s;
    server backend4:5006 max_fails=2 fail_timeout=10s; }
  upstream app_07 {   # Razorpay.payment
