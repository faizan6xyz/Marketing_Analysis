events {}

http {
    include mime.types;

    server {
        listen 5000;
        location /gmail {
            proxy_pass http://127.0.0.1:8001;   # gunicorn/flask process for Gmail app
            proxy_set_header Host $host;
        }
    }

    server {
        listen 5100;
        location /Instagram {
            proxy_pass http://127.0.0.1:8002;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 5200;
        location /Paypal {
            proxy_pass http://127.0.0.1:8003;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 5300;
        location /Razorpay {
            proxy_pass http://127.0.0.1:8004;
            proxy_set_header Host $host;
        }
    }
    server {
        listen 5400;
        location /pinterst {
            proxy_pass http://127.0.0.1:8005;
            proxy_set_header Host $host;
        }
    }
    server {
        listen 5500;
        location /threads {
            proxy_pass http://127.0.0.1:8006;
            proxy_set_header Host $host;
        }
    }
    server {
        listen 5600;
        location /Whatsapp {
            proxy_pass http://127.0.0.1:8007;
            proxy_set_header Host $host;
        }
    }
    server {
        listen 5700;
        location /Razorpay {
            proxy_pass http://127.0.0.1:8008;
            proxy_set_header Host $host;
        }
    }
    server {
        listen 5800;
        location /Razorpay {
            proxy_pass http://127.0.0.1:8009;
            proxy_set_header Host $host;
        }
    }
}