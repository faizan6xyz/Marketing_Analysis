events {}

http {
  limit_req_zone $binary_remote_addr zone=perminute:10m rate=60r/m;
  limit_req_status 429;

  # One upstream per app. Each points at its Kubernetes Service. the Service handles load balancing across pods, nginx handles reverse proxying.
  upstream app_00 { server app-00-service:5000; }   # login
  upstream app_01 { server app-01-service:5000; }   # campaign
  upstream app_02 { server app-02-service:5000; }   # youtube login
  upstream app_03 { server app-03-service:5000; }   # X login
  upstream app_04 { server app-04-service:5000; }   # whatsapp login
  upstream app_05 { server app-05-service:5000; }   # threads login
  upstream app_06 { server app-06-service:5000; }   # threads webhook
  upstream app_07 { server app-07-service:5000; }   # razorpay payment
  upstream app_08 { server app-08-service:5000; }   # pinterest login
  upstream app_09 { server app-09-service:5000; }   # paypal payments
  upstream app_10 { server app-10-service:5000; }   # instagram login
  upstream app_11 { server app-11-service:5000; }   # instagram webhook
  upstream app_12 { server app-12-service:5000; }   # gmail app2
  upstream app_13 { server app-13-service:5000; }   # drive dep
  upstream app_14 { server app-14-service:5000; }   # gmail webhook
  upstream app_15 { server app_15-service:5000; }   # Whatsapp webhook

  # Shared proxy settings
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_next_upstream error timeout http_502 http_503;
  proxy_read_timeout 60s;

  server {
    listen 80;
    # Login / OAuth endpoints (rate limited)
    location /00/ { proxy_pass http://app_00/; limit_req zone=perminute burst=10 nodelay; }
    location /01/ { proxy_pass http://app_01/; limit_req zone=perminute burst=10 nodelay; }
    location /02/ { proxy_pass http://app_02/; limit_req zone=perminute burst=10 nodelay; }
    location /03/ { proxy_pass http://app_03/; limit_req zone=perminute burst=10 nodelay; }
    location /05/ { proxy_pass http://app_05/; limit_req zone=perminute burst=10 nodelay; }
    location /08/ { proxy_pass http://app_08/; limit_req zone=perminute burst=10 nodelay; }
    location /10/ { proxy_pass http://app_10/; limit_req zone=perminute burst=10 nodelay; }
    location /12/ { proxy_pass http://app_12/; limit_req zone=perminute burst=10 nodelay; }
    location /13/ { proxy_pass http://app_13/; limit_req zone=perminute burst=10 nodelay; }
    # Webhooks / payments / WhatsApp (not rate limited, so provider retries aren't dropped)
    location /04/ { proxy_pass http://app_04/; }
    location /06/ { proxy_pass http://app_06/; }
    location /07/ { proxy_pass http://app_07/; }
    location /09/ { proxy_pass http://app_09/; }
    location /11/ { proxy_pass http://app_11/; }
    location /15/ { proxy_pass http://app_15/; }
    location /14/ { proxy_pass http://app_14/; }  }}




# burst=10: nginx keeps a queue of 10 spare slots per IP. A request that arrives too early takes a slot instead of being rejected. Slots refill at the normal rate, one per second.
# nodelay: requests that use a spare slot are served immediately. Without it, nginx holds them back and releases them one per second, so the client waits, and the 10th queued request waits about 10 seconds.

# $binary_remote_addr: what to count by. This is the client's IP address in a compact form, so each IP gets its own counter.
# zone=perminute:10m: the zone's name and its memory. perminute is the name your limit_req zone=perminute lines refer to, and 10m is 10 MB of shared memory. That is enough to track roughly 160,000 IPs. If the memory fills up, nginx drops the oldest entries, and if it can't make room it rejects new requests.
# rate=60r/m: the steady allowed speed, 60 requests per minute, which is 1 per second. nginx works in whole milliseconds, so it enforces this as one request per second rather than as a 60-request counter that resets every minute.
# limit_req_status 429 sets the status code returned to rejected requests. The default is 503 Service Unavailable, which looks like a server fault. 429 Too Many Requests is the correct code for rate limiting, and many clients and libraries know to back off and retry when they see it.