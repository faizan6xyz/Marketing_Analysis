    server backend3:5011 max_fails=2 fail_timeout=10s;
    server backend4:5011 max_fails=2 fail_timeout=10s; }
  upstream app_12 {   # Gmail.APP2
    server backend1:5012 max_fails=2 fail_timeout=10s;
    server backend2:5012 max_fails=2 fail_timeout=10s;
    server backend3:5012 max_fails=2 fail_timeout=10s;
    server backend4:5012 max_fails=2 fail_timeout=10s; }
  upstream app_13 {   # Drive.dep
    server backend1:5013 max_fails=2 fail_timeout=10s;
    server backend2:5013 max_fails=2 fail_timeout=10s;
    server backend3:5013 max_fails=2 fail_timeout=10s;
    server backend4:5013 max_fails=2 fail_timeout=10s; }
  upstream app_14 {   # Gmail.webhook
    server backend1:5014 max_fails=2 fail_timeout=10s;
    server backend2:5014 max_fails=2 fail_timeout=10s;
    server backend3:5014 max_fails=2 fail_timeout=10s;
    server backend4:5014 max_fails=2 fail_timeout=10s; }

  # Shared proxy settings
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_next_upstream error timeout http_502 http_503;
  proxy_read_timeout 60s;

  server {
    listen 80;
    location /00/ { proxy_pass http://app_00/;
                    limit_req zone=perminute burst=10 nodelay; }   # login
    location /01/ { proxy_pass http://app_01/;
                    limit_req zone=perminute burst=10 nodelay; }   # campaign
    location /02/ { proxy_pass http://app_02/;
                    limit_req zone=perminute burst=10 nodelay; }    # youtube login
    location /03/ { proxy_pass http://app_03/; 
                    limit_req zone=perminute burst=10 nodelay; }    # X login
    location /04/ { proxy_pass http://app_04/; }   # Whatsapp login
    location /05/ { proxy_pass http://app_05/; 
                    limit_req zone=perminute burst=10 nodelay; }    # threads login
    location /06/ { proxy_pass http://app_06/; }   # threads webhook
    location /07/ { proxy_pass http://app_07/; }   # Razorpay payment
    location /08/ { proxy_pass http://app_08/; 
                    limit_req zone=perminute burst=10 nodelay; }    # pinterest login
    location /09/ { proxy_pass http://app_09/; }   # Paypal payments
    location /10/ { proxy_pass http://app_10/; 
                    limit_req zone=perminute burst=10 nodelay; }   # Instagram login
    location /11/ { proxy_pass http://app_11/; }   # Instagram webhook
    location /12/ { proxy_pass http://app_12/; 
                    limit_req zone=perminute burst=10 nodelay; }   # Gmail APP2
    location /13/ { proxy_pass http://app_13/; 
                    limit_req zone=perminute burst=10 nodelay; }   # Drive dep
    location /14/ { proxy_pass http://app_14/; }   # Gmail webhook 
    }}


# burst=10: nginx keeps a queue of 10 spare slots per IP. A request that arrives too early takes a slot instead of being rejected. Slots refill at the normal rate, one per second.
# nodelay: requests that use a spare slot are served immediately. Without it, nginx holds them back and releases them one per second, so the client waits, and the 10th queued request waits about 10 seconds.

# $binary_remote_addr: what to count by. This is the client's IP address in a compact form, so each IP gets its own counter.
# zone=perminute:10m: the zone's name and its memory. perminute is the name your limit_req zone=perminute lines refer to, and 10m is 10 MB of shared memory. That is enough to track roughly 160,000 IPs. If the memory fills up, nginx drops the oldest entries, and if it can't make room it rejects new requests.
# rate=60r/m: the steady allowed speed, 60 requests per minute, which is 1 per second. nginx works in whole milliseconds, so it enforces this as one request per second rather than as a 60-request counter that resets every minute.
# limit_req_status 429 sets the status code returned to rejected requests. The default is 503 Service Unavailable, which looks like a server fault. 429 Too Many Requests is the correct code for rate limiting, and many clients and libraries know to back off and retry when they see it.