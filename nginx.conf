    server backend4:5008 max_fails=2 fail_timeout=10s; }
  upstream app_09 {   # Paypal.paypal_payments
    server backend1:5009 max_fails=2 fail_timeout=10s;
    server backend2:5009 max_fails=2 fail_timeout=10s;
    server backend3:5009 max_fails=2 fail_timeout=10s;
    server backend4:5009 max_fails=2 fail_timeout=10s; }
  upstream app_10 {   # Instagram.Login
    server backend1:5010 max_fails=2 fail_timeout=10s;
    server backend2:5010 max_fails=2 fail_timeout=10s;
    server backend3:5010 max_fails=2 fail_timeout=10s;
    server backend4:5010 max_fails=2 fail_timeout=10s; }
  upstream app_11 {   # Instagram.webhook
