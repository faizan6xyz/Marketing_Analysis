events {
    worker_connections 1024;
}

http {
    include mime.types;

    # ---- Logging ----
    log_format main '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time uct=$upstream_connect_time '
                     'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---- Upstreams (add more servers here for load balancing) ----
    upstream gmail_backend {
        least_conn;                      # or default round-robin, or ip_hash
        server 127.0.0.1:8001;
        server 127.0.0.1:8001b;          # example: add a second instance
    }

    upstream instagram_backend {
        least_conn;
        server 127.0.0.1:8002;
    }

    upstream paypal_backend {
        least_conn;
        server 127.0.0.1:8003;
    }

    upstream razorpay_backend {
        least_conn;
        server 127.0.0.1:8004;
        server 127.0.0.1:8008;
        server 127.0.0.1:8009;
    }

    upstream pinterest_backend {
        least_conn;
        server 127.0.0.1:8005;
    }

    upstream threads_backend {
        least_conn;
        server 127.0.0.1:8006;
    }

    upstream whatsapp_backend {
        least_conn;
        server 127.0.0.1:8007;
    }

    # ---- Servers ----
    server {
        listen 5000;
        access_log /var/log/nginx/gmail.access.log main;
        error_log  /var/log/nginx/gmail.error.log warn;

        location /gmail {
            proxy_pass http://gmail_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 5100;
        access_log /var/log/nginx/instagram.access.log main;
        error_log  /var/log/nginx/instagram.error.log warn;

        location /Instagram {
            proxy_pass http://instagram_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 5200;
        access_log /var/log/nginx/paypal.access.log main;
        error_log  /var/log/nginx/paypal.error.log warn;

        location /Paypal {
            proxy_pass http://paypal_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 5300;
        access_log /var/log/nginx/razorpay.access.log main;
        error_log  /var/log/nginx/razorpay.error.log warn;

        location /Razorpay {
            proxy_pass http://razorpay_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 5400;
        access_log /var/log/nginx/pinterest.access.log main;
        error_log  /var/log/nginx/pinterest.error.log warn;

        location /pinterst {
            proxy_pass http://pinterest_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 5500;
        access_log /var/log/nginx/threads.access.log main;
        error_log  /var/log/nginx/threads.error.log warn;

        location /threads {
            proxy_pass http://threads_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 5600;
        access_log /var/log/nginx/whatsapp.access.log main;
        error_log  /var/log/nginx/whatsapp.error.log warn;

        location /Whatsapp {
            proxy_pass http://whatsapp_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}