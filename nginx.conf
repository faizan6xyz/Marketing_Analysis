events {}
http {
  limit_req_zone $binary_remote_addr zone=perminute:10m rate=60r/m;
  limit_req_status 429;
  upstream app_00 {   # login
    server backend1:5000 max_fails=2 fail_timeout=10s;
    server backend2:5000 max_fails=2 fail_timeout=10s;
    server backend3:5000 max_fails=2 fail_timeout=10s;
    server backend4:5000 max_fails=2 fail_timeout=10s; }
  upstream app_01 {   # campaign
    server backend1:5001 max_fails=2 fail_timeout=10s;
